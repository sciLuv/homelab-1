mode: standalone

cluster:
  instances: 1

  initdb:
    database: nextcloud
    owner: nextcloud
    postInitSQL:
      - CREATE EXTENSION IF NOT EXISTS vector;

  storage:
    size: 4Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  roles:
    - name: nextcloud
      ensure: present
      comment: Nextcloud Database User
      login: true
      superuser: false
      passwordSecret:
        name: db-nextcloud-user

  postgresql:
    parameters:
      max_connections: "100"
    pg_hba:
      - hostssl all all 10.244.0.0/16 scram-sha-256

backups:
  enabled: true

  # MinIO interne CNPG -> MinIO
  provider: s3

  # IMPORTANT : schéma + host + port
  endpointURL: "http://myminio-hl.minio.svc.cluster.local:9000"

  # On laisse le chart générer s3://<bucket><path>
  # -> s3://cnpg-backups/postgres/
  destinationPath: ""

  s3:
    bucket: "cnpg-backups"
    path: "/postgres/"
    region: "us-east-1"
    accessKey: "minio"      # à remplacer par un user dédié MinIO plus tard
    secretKey: "minio123"
    inheritFromIAMRole: false

  endpointCA:
    create: false
    name: ""
    key: ""
    value: ""

  secret:
    create: true
    name: cnpg-backup-creds

  wal:
    compression: gzip
    encryption: ""
    maxParallel: 1

  data:
    compression: gzip
    encryption: ""
    jobs: 2

  # Cron agressif pour valider rapidement que ça marche
  scheduledBackups:
    - name: quick-test
      schedule: "0 0 2 * * *" 
      backupOwnerReference: self
      method: barmanObjectStore

  retentionPolicy: "30d"
